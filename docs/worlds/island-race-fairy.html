<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f0e8"><title>花仙子 · 金银岛 · 第三盏灯</title><link rel="stylesheet" href="../_modules/island/origin.css"><link rel="stylesheet" href="../_modules/island/island.css"><script src="../_modules/island/island.js" defer></script></head><body><a class="skip-link" href="#main">跳到正文</a><header class="site-header"><a class="brand" href="../"><span class="seal"><img src="../_modules/island/assets/third-lamp-seal.png" alt=""></span><span>第三盏灯</span></a><a class="home-link" href="../">回到灯前 ↗</a></header><main id="main" class="island-main"><nav class="island-tabs" aria-label="金银岛分页"><a href="island.html" >岛与起源</a><a href="island-species.html" aria-current="page">诸族图鉴</a></nav><section class="race-opening"><a href="island-species.html">← 诸族图鉴</a><h1>花仙子</h1></section><div class="race-layout"><nav class="race-toc" aria-label="本页目录"><a href="#block-f792c566e18d5f0c8cb55945b8bedddb">花仙子</a><a href="#block-90980e37c4a05b3a920f620070f526c4">芙罗拉</a></nav><div class="race-reading"><section class="race-block" id="block-f792c566e18d5f0c8cb55945b8bedddb"><h2>花仙子</h2><p>是受精灵照料的妖精，功能性野外灭绝，因为对生存要求很苛刻。目前大量居住在花苑中的培育室，森林中偶有。<br>短寿种，体型很小，生着翅膀，有较为强大的净化和治愈能力</p></section><details class="island-npc" id="block-90980e37c4a05b3a920f620070f526c4"><summary>芙罗拉</summary><p>出生于花圃之外的绣球花中，被拉尔夫拾到，交由玛丽戈德照顾。粉蓝眼眸、花形瞳孔与半透明蝶翼，头发随季节变色，喜欢跟随精灵朋友。</p></details><nav class="race-links" aria-label="相关地域"><a href="island.html#region-forest">新叶森林 ↗</a></nav></div></div></main><footer class="site-footer"><span>第三盏灯 · 金银岛</span><a href="#main">回到页首 ↑</a><a href="../">回到灯前 ↗</a></footer></body></html>

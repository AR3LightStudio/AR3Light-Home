<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f0e8"><title>巨龙 · 金银岛 · 第三盏灯</title><link rel="stylesheet" href="../origin.css"><link rel="stylesheet" href="../island.css"><script src="../island.js" defer></script></head><body><a class="skip-link" href="#main">跳到正文</a><header class="site-header"><a class="brand" href="../"><span class="seal"><img src="../assets/third-lamp-seal.png" alt=""></span><span>第三盏灯</span></a><a class="home-link" href="../">回到灯前 ↗</a></header><main id="main" class="island-main"><nav class="island-tabs" aria-label="金银岛分页"><a href="island.html" >岛与起源</a><a href="island-species.html" aria-current="page">诸族图鉴</a></nav><section class="race-opening"><a href="island-species.html">← 诸族图鉴</a><h1>巨龙</h1><p>巨龙沉眠在龙息山脉，几座浮空岛被永恒的龙息托举在空中。</p></section><div class="race-layout"><nav class="race-toc" aria-label="本页目录"><a href="#block-5303514d0ff65ffa893ed8e4593042bf">尤里西斯</a><a href="#block-4d642d50be5b4c01a2e75a46e6997c42">梵纳尔</a></nav><div class="race-reading"><details class="island-npc" id="block-5303514d0ff65ffa893ed8e4593042bf"><summary>尤里西斯</summary><p>白塔城城主，一千五百岁的年轻黑龙，金色竖瞳，天性高傲贪婪、肆意妄为，拥有极强破坏力。八百年前建造白塔城，将城市视作自己的沙盘游戏。</p></details><details class="island-npc" id="block-4d642d50be5b4c01a2e75a46e6997c42"><summary>梵纳尔</summary><p>盘踞雪山之巅的银龙，三千七百岁，多数时候都在沉睡。人形拥有银色长角、白发与深蓝眼睛，性情散漫，对世间纷争兴趣不大。</p></details><nav class="race-links" aria-label="相关地域"><a href="island.html#region-dragon">龙息山脉 ↗</a></nav></div></div></main><footer class="site-footer"><span>第三盏灯 · 金银岛</span><a href="#main">回到页首 ↑</a><a href="../">回到灯前 ↗</a></footer><!-- BGM --><link rel="stylesheet" href="../bgm.css"><script defer src="../bgm.js" data-group="island" data-src="../assets/music/island.mp3" data-title="Enchanted Valley" data-credit="Enchanted Valley — Kevin MacLeod (incompetech.com) · CC BY 4.0 · 音频未修改" data-source="https://incompetech.com/music/royalty-free/index.html?isrc=USU

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f0e8"><title>魅魔 · 金银岛 · 第三盏灯</title><link rel="stylesheet" href="../origin.css"><link rel="stylesheet" href="../island.css"><script src="../island.js" defer></script></head><body><a class="skip-link" href="#main">跳到正文</a><header class="site-header"><a class="brand" href="../"><span class="seal"><img src="../assets/third-lamp-seal.png" alt=""></span><span>第三盏灯</span></a><a class="home-link" href="../">回到灯前 ↗</a></header><main id="main" class="island-main"><nav class="island-tabs" aria-label="金银岛分页"><a href="island.html" >岛与起源</a><a href="island-species.html" aria-current="page">诸族图鉴</a></nav><section class="race-opening"><a href="island-species.html">← 诸族图鉴</a><h1>魅魔</h1><p>金银岛上最大的魅魔聚集地坐落于白塔城。</p></section><div class="race-layout"><nav class="race-toc" aria-label="本页目录"><a href="#block-0246ca0dc0075a1fbd2a4c853b260749">塞拉菲娜</a><a href="#block-0feec95159eb5239b1f11fba2d26c9c6">凯里</a></nav><div class="race-reading"><details class="island-npc" id="block-0246ca0dc0075a1fbd2a4c853b260749"><summary>塞拉菲娜</summary><p>暗紫眼眸、火红长发、黑色犄角与桃心尾，常携黑牛皮教鞭。以美貌闻名，张扬肆意、八面玲珑，行踪如风般漂泊不定。</p></details><details class="island-npc" id="block-0feec95159eb5239b1f11fba2d26c9c6"><summary>凯里</summary><p>白塔城骑兵团长，兼调城主亲卫队长。红色长发、墨绿眼眸，洁身自好，认真负责，平时也仔细打理头发与衣着。</p></details><nav class="race-links" aria-label="相关地域"><a href="island.html#region-tower">白塔城 ↗</a></nav></div></div></main><footer class="site-footer"><span>第三盏灯 · 金银岛</span><a href="#main">回到页首 ↑</a><a href="../">回到灯前 ↗</a></footer><!-- BGM --><link rel="stylesheet" href="../bgm.css"><script defer src="../bgm.js" data-group="island" data-src="../assets/music/island.mp3" data-title="Enchanted Valley" data-credit="Enchanted Valley — Kevin MacLeod (incompetech.com) · CC BY 4.0 · 音频未修改" data-source="https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1200093"></script><!-- /BGM -
